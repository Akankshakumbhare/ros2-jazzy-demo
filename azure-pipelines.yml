trigger:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  imageName: ros2-jazzy-demo
  acrName: prodacr001.azurecr.io
  imageTag: $(Build.BuildId)
  namespace: production

  dockerRegistryServiceConnection: prodacr001-manual
  kubernetesServiceConnection: aks-service-connection
  aksResourceGroup: rg-prod-aks
  aksCluster: prod-aks

# =========================================================
# STAGE 1 — BUILD + PUSH + SCAN
# =========================================================
stages:
- stage: Build_Scan
  displayName: Build and Security Scan

  jobs:
  - job: BuildDocker
    displayName: Build Push Scan

    steps:
    - checkout: self

    # Login to ACR
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    # Pull private base image first
    - script: |
        docker pull $(acrName)/ros:jazzy-ros-base
      displayName: Pull Base Image

    # Build and Push
              # Build and Push
    - task: Docker@2
      displayName: Build and Push Image
      env:
        DOCKER_BUILDKIT: 0
        inputs:  
        command: buildAndPush
        repository: $(imageName)
        dockerfile: Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(imageTag)
          latest

    # Verify images
    - script: docker images
      displayName: List Docker Images

    # Install Trivy
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget

        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.63.0_Linux-64bit.deb
        sudo dpkg -i trivy_0.63.0_Linux-64bit.deb

        trivy --version
      displayName: Install Trivy

    # Scan image
    - script: |
        trivy image \
          --timeout 10m \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --no-progress \
          $(acrName)/$(imageName):$(imageTag)
      displayName: Trivy Security Scan

    # Generate report
    - script: |
        trivy image \
          --format json \
          --output trivy-report.json \
          $(acrName)/$(imageName):$(imageTag)
      displayName: Generate Trivy Report

    # Publish report
    - task: PublishBuildArtifacts@1
      displayName: Publish Trivy Report
      inputs:
        PathtoPublish: trivy-report.json
        ArtifactName: trivy-report

# =========================================================
# STAGE 2 — RUNTIME VALIDATION
# =========================================================
- stage: Validate_Runtime
  displayName: Runtime Validation
  dependsOn: Build_Scan
  condition: succeeded()

  jobs:
  - job: ValidateContainer
    displayName: Validate ROS2 Runtime

    steps:
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        docker pull $(acrName)/$(imageName):$(imageTag)
      displayName: Pull Image

    - script: |
        docker run -d --name ros-demo \
          $(acrName)/$(imageName):$(imageTag)

        sleep 20
        docker ps -a
      displayName: Start Container

    - script: |
        docker logs ros-demo > output.log 2>&1 || true
        cat output.log

        if grep -q "Publishing" output.log; then
          echo "ROS2 publisher validation successful"
        else
          echo "Validation failed"
          exit 1
        fi
      displayName: Validate Publisher

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: output.log
        ArtifactName: ros2-logs

# =========================================================
# STAGE 3 — DEPLOY TO AKS
# =========================================================
- stage: Deploy_AKS
  displayName: Deploy to Production
  dependsOn: Validate_Runtime
  condition: succeeded()

  jobs:
  - deployment: DeployToAKS
    displayName: Deploy to AKS
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: KubernetesManifest@1
            displayName: Deploy Namespace
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              manifests: |
                k8s/namespace.yaml

          - task: KubernetesManifest@1
            displayName: Deploy Application
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              namespace: $(namespace)
              manifests: |
                k8s/deployment.yaml
                k8s/service.yaml
                k8s/ingress.yaml
              containers: |
                $(acrName)/$(imageName):$(imageTag)

          - task: Kubernetes@1
            displayName: Verify Deployment
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              command: get
              arguments: pods -n $(namespace)

# =========================================================
# STAGE 4 — ROLLBACK
# =========================================================
- stage: Rollback
  displayName: Automatic Rollback
  dependsOn: Deploy_AKS
  condition: failed()

  jobs:
  - job: RollbackJob
    displayName: Rollback Deployment

    steps:
    - task: Kubernetes@1
      inputs:
        connectionType: Azure Resource Manager
        azureSubscriptionEndpoint: $(kubernetesServiceConnection)
        azureResourceGroup: $(aksResourceGroup)
        kubernetesCluster: $(aksCluster)
        command: rollout
        arguments: undo deployment/ros2-jazzy-demo -n $(namespace)