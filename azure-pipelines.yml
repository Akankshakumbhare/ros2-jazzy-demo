trigger:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  imageName: ros2-jazzy-demo
  acrName: prodacr001.azurecr.io
  imageTag: $(Build.BuildId)
  namespace: production

  dockerRegistryServiceConnection: prodacr001-manual
  kubernetesServiceConnection: aks-service-connection
  aksResourceGroup: rg-prod-aks
  aksCluster: prod-aks

# =========================================================
# STAGE 1 — BUILD + PUSH + SECURITY SCAN
# =========================================================
stages:
- stage: Build_Scan
  displayName: Build and Security Scan

  jobs:
  - job: BuildDocker
    displayName: Build Push Scan

    steps:
    - checkout: self

    # Build and Push using ACR Task
    - task: AzureCLI@2
      displayName: Build and Push to ACR
      inputs:
        azureSubscription: $(kubernetesServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr build \
            --registry $(acrName) \
            --image $(imageName):$(imageTag) \
            --image $(imageName):latest \
            --file Dockerfile \
            .

    # Verify images
    - script: |
        docker images
      displayName: List Docker Images

    # Install Trivy using official repository (Recommended)
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        
        # Add Trivy repository
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        
        # Install Trivy
        sudo apt-get update
        sudo apt-get install -y trivy
        
        trivy --version
      displayName: Install Trivy

    - task: AzureCLI@2
      displayName: Pull Image for Scan
      inputs:
        azureSubscription: $(kubernetesServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logging into ACR..."
          az acr login --name $(acrName)
          
          echo "Pulling image $(acrName)/$(imageName):$(imageTag)..."
          docker pull $(acrName)/$(imageName):$(imageTag)
          
          echo "Verifying image..."
          docker images | grep $(imageName)

    # Security Scan
    - script: |
        trivy image \
          --timeout 10m \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --no-progress \
          $(acrName)/$(imageName):$(imageTag)
      displayName: Trivy Security Scan

    # Generate JSON Report
    - script: |
        trivy image \
          --format json \
          --output trivy-report.json \
          $(acrName)/$(imageName):$(imageTag)
      displayName: Generate Trivy Report

    # Publish Scan Report
    - task: PublishBuildArtifacts@1
      displayName: Publish Trivy Report
      inputs:
        PathtoPublish: trivy-report.json
        ArtifactName: trivy-report
    
# =========================================================
# STAGE 2 — RUNTIME VALIDATION
# =========================================================
- stage: Validate_Runtime
  displayName: Runtime Validation
  dependsOn: Build_Scan
  condition: succeeded()

  jobs:
  - job: ValidateContainer
    displayName: Validate ROS2 Runtime

    steps:

    # Login to ACR
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    # Pull built image
    - script: |
        docker pull $(acrName)/$(imageName):$(imageTag)
      displayName: Pull Image

    # Run container
    - script: |
        docker run -d --name ros-demo \
          $(acrName)/$(imageName):$(imageTag)

        sleep 20

        docker ps -a
      displayName: Start Container

    # Validate ROS2 publisher
    - script: |
        docker logs ros-demo > output.log 2>&1 || true

        echo "========== CONTAINER LOGS =========="
        cat output.log

        if grep -q "Publishing" output.log; then
          echo "ROS2 publisher validation successful"
        else
          echo "ROS2 publisher validation failed"
          exit 1
        fi
      displayName: Validate Publisher

    # Clean up container
    - script: |
        docker stop ros-demo
        docker rm ros-demo
      displayName: Clean Up Container
      condition: always()

    # Publish logs
    - task: PublishBuildArtifacts@1
      displayName: Publish Logs Artifact
      inputs:
        PathtoPublish: output.log
        ArtifactName: ros2-logs
      condition: always()

# =========================================================
# STAGE 3 — DEPLOY TO AKS
# =========================================================
- stage: Deploy_AKS
  displayName: Deploy to Production
  dependsOn: Validate_Runtime
  condition: succeeded()

  jobs:
  - deployment: DeployToAKS
    displayName: Deploy to AKS
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # Create namespace
          - task: KubernetesManifest@1
            displayName: Create Namespace
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              manifests: |
                k8s/namespace.yaml

          # Deploy application
          - task: KubernetesManifest@1
            displayName: Deploy Application
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              namespace: $(namespace)
              manifests: |
                k8s/deployment.yaml
                k8s/service.yaml
                k8s/ingress.yaml
              containers: |
                $(acrName)/$(imageName):$(imageTag)

          # Verify pods
          - task: Kubernetes@1
            displayName: Verify Pods
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              command: get
              arguments: pods -n $(namespace)

          # Verify services
          - task: Kubernetes@1
            displayName: Verify Services
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              command: get
              arguments: svc -n $(namespace)

          # Verify ingress
          - task: Kubernetes@1
            displayName: Verify Ingress
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(kubernetesServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              command: get
              arguments: ingress -n $(namespace)

# =========================================================
# STAGE 4 — AUTOMATIC ROLLBACK
# =========================================================
- stage: Rollback
  displayName: Automatic Rollback
  dependsOn: Deploy_AKS
  condition: failed()

  jobs:
  - job: RollbackJob
    displayName: Rollback Deployment

    steps:
    - task: Kubernetes@1
      displayName: Rollback Deployment
      inputs:
        connectionType: Azure Resource Manager
        azureSubscriptionEndpoint: $(kubernetesServiceConnection)
        azureResourceGroup: $(aksResourceGroup)
        kubernetesCluster: $(aksCluster)
        command: rollout
        arguments: undo deployment/ros2-jazzy-demo -n $(namespace)