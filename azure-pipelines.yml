trigger:
- main

pool:
  vmImage: ubuntu-24.04

variables:
  imageName: ros2-jazzy-demo
  tag: $(Build.BuildId)

stages:

- stage: Build_Test
  displayName: Build Test and Push

  jobs:

  - job: BuildDocker
    displayName: Build Docker Image

    steps:

    - checkout: self

    # Build and Push Docker image to ACR
    - task: Docker@2
      displayName: Build and Push Image

      inputs:
        command: buildAndPush

        repository: $(imageName)

        Dockerfile: Dockerfile

        containerRegistry: acr-service-connection

        tags: |
          $(tag)
          latest

    # Start container locally for validation
    - script: |
        docker run -d --name ros-demo $(imageName):$(tag)
        sleep 10

      displayName: Start Container

    # Show container logs
    - script: |
        docker logs ros-demo

      displayName: Show Logs

    # Validate ROS2 publisher output
    - script: |

        docker logs ros-demo > output.log 2>&1

        cat output.log

        if grep -q "Hello, world!" output.log; then
          echo "ROS2 publisher validation successful"
        else
          echo "ROS2 publisher validation failed"
          exit 1
        fi

      displayName: Validate Publisher

    # Save logs
    - script: |
        docker logs ros-demo > publisher.log 2>&1

      displayName: Save Logs

    # Publish logs as pipeline artifact
    - task: PublishBuildArtifacts@1
      displayName: Publish Logs Artifact

      inputs:
        pathToPublish: publisher.log
        artifactName: ros2-logs