trigger:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  imageName: ros2-jazzy-demo
  acrName: prodacr001.azurecr.io
  imageTag: $(Build.BuildId)
  namespace: production

stages:

# =========================================================
# STAGE 1 — BUILD + SECURITY SCAN
# =========================================================
- stage: Build_Scan
  displayName: Build and Security Scan

  jobs:
    - job: BuildDocker
      displayName: Build Push Scan

      steps:
        - checkout: self

        - task: Docker@2
          displayName: Build and Push Image
          inputs:
            command: buildAndPush
            repository: $(imageName)
            Dockerfile: Dockerfile
            containerRegistry: prodacr001-manual
            tags: |
              $(imageTag)
              latest

        - script: docker images
          displayName: List Docker Images

        - script: |
            sudo apt-get update
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release

            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy

            trivy --version
          displayName: Install Trivy

        - task: Docker@2
          displayName: Login to ACR
          inputs:
            command: login
            containerRegistry: prodacr001-manual

        - script: |
            trivy image \
              --timeout 10m \
              --severity CRITICAL \
              --exit-code 1 \
              --no-progress \
              $(acrName)/$(imageName):$(imageTag)
          displayName: Trivy Security Scan

        - script: |
            trivy image \
              --format json \
              --output trivy-report.json \
              $(acrName)/$(imageName):$(imageTag)
          displayName: Generate Trivy Report

        - task: PublishBuildArtifacts@1
          displayName: Publish Trivy Report
          inputs:
            PathtoPublish: trivy-report.json
            ArtifactName: trivy-report

# =========================================================
# STAGE 2 — RUNTIME VALIDATION
# =========================================================
- stage: Validate_Runtime
  displayName: Runtime Validation
  dependsOn: Build_Scan
  condition: succeeded()

  jobs:
    - job: ValidateContainer
      displayName: Validate ROS2 Runtime

      steps:
        - checkout: self

        # Run container
        - script: |
            docker run --name ros-demo \
              $(acrName)/$(imageName):$(imageTag) || true

            docker ps -a
          displayName: Start Container

        # Show container status
        - script: |
            docker ps -a
          displayName: Check Containers

        # Show logs without failing pipeline
        - script: |
            docker logs ros-demo || true
          displayName: Show Logs

        # Validate ROS2 output
        - script: |
            docker logs ros-demo > output.log 2>&1 || true
            cat output.log

            if grep -q "Hello, world!" output.log; then
              echo "ROS2 publisher validation successful"
            else
              echo "ROS2 publisher validation failed"
              exit 1
            fi
          displayName: Validate Publisher

        # Save logs as artifact
        - script: |
            docker logs ros-demo > publisher.log 2>&1 || true
          displayName: Save Logs

        - task: PublishBuildArtifacts@1
          displayName: Publish Logs Artifact
          inputs:
            PathtoPublish: publisher.log
            ArtifactName: ros2-logs

# =========================================================
# STAGE 3 — DEPLOY TO AKS
# =========================================================
- stage: Deploy_AKS
  displayName: Deploy to Production
  dependsOn: Validate_Runtime
  condition: succeeded()

  jobs:
    - deployment: DeployToAKS
      displayName: Production Deployment
      environment: production

      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - task: Kubernetes@1
                displayName: Authenticate to AKS
                inputs:
                  connectionType: Kubernetes Service Connection
                  kubernetesServiceEndpoint: aks-service-connection
                  command: login

              - task: KubernetesManifest@1
                displayName: Deploy to AKS
                inputs:
                  action: deploy
                  kubernetesServiceConnection: aks-service-connection
                  namespace: $(namespace)
                  manifests: |
                    k8s/deployment.yaml
                  containers: |
                    $(acrName)/$(imageName):$(imageTag)

              - script: |
                  kubectl rollout status deployment/ros2-jazzy-demo \
                    -n $(namespace) \
                    --timeout=300s
                displayName: Verify Rollout

              - script: |
                  kubectl get pods -n $(namespace)
                  kubectl get svc -n $(namespace)
                displayName: Validate Deployment

# =========================================================
# STAGE 4 — AUTO ROLLBACK
# =========================================================
- stage: Rollback
  displayName: Automatic Rollback
  dependsOn: Deploy_AKS
  condition: failed()

  jobs:
    - job: RollbackJob
      displayName: Rollback Deployment

      steps:
        - task: Kubernetes@1
          displayName: Authenticate to AKS
          inputs:
            connectionType: Kubernetes Service Connection
            kubernetesServiceEndpoint: aks-service-connection
            command: login

        - script: |
            kubectl rollout undo deployment/ros2-jazzy-demo -n production
            kubectl rollout status deployment/ros2-jazzy-demo -n production
          displayName: Rollback to Previous Stable Version