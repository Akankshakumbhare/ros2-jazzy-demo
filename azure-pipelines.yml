trigger:
- main

pool:
  vmImage: ubuntu-24.04

variables:
  imageName: ros2-jazzy-demo
  tag: $(Build.BuildId)

stages:

- stage: Build_Test

  jobs:

  - job: BuildDocker

    steps:

    - checkout: self

    - task: Docker@2
      displayName: Build Image

      inputs:
        command: build
        Dockerfile: Dockerfile
        repository: $(imageName)

        tags: |
          $(tag)

    - script: |
        docker run -d --name ros-demo $(imageName):$(tag)
        sleep 10

      displayName: Start Container


    - script: |
        docker logs ros-demo

      displayName: Show Logs


    - script: |
        docker logs ros-demo > output.log

        cat output.log

        if cat output.log | grep -q "Hello, world!"; then
          echo "ROS2 publisher validation successful"
        else
          echo "ROS2 publisher validation failed"
          exit 1
        fi

      displayName: Validate Publisher


    - script: |
        docker logs ros-demo > publisher.log

      displayName: Save Logs


    - task: PublishBuildArtifacts@1

      inputs:
        pathToPublish: publisher.log
        artifactName: ros2-logs